services:
  gateway:
    build: ./gateway
    container_name: cp-gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      client_net:
        ipv4_address: 172.28.0.2
      server_net:
        ipv4_address: 172.29.0.2
    command: ["sleep", "infinity"]

  client:
    build: ./client
    container_name: cp-client
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
    networks:
      client_net:
        ipv4_address: 172.28.0.10
    command:
      - sh
      - -c
      - |
        ip route replace 172.29.0.0/24 via 172.28.0.2
        sleep infinity

  protected_server:
    build: ./protected_server
    container_name: cp-protected-server
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
    networks:
      server_net:
        ipv4_address: 172.29.0.10
    command:
      - sh
      - -c
      - |
        ip route replace 172.28.0.0/24 via 172.29.0.2
        exec python /app/server.py

networks:
  client_net:
    name: cp-client-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

  server_net:
    name: cp-server-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
